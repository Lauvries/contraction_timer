<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1523" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Timeline</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="top-nav" aria-label="Primary">
        <a class="top-nav-link" href="./index.html">Feeds</a>
        <span class="top-nav-sep" aria-hidden="true">·</span>
        <a class="top-nav-link" href="./contractions.html">Contractions</a>
        <span class="top-nav-sep" aria-hidden="true">·</span>
        <a class="top-nav-link is-active" href="./timeline.html" aria-current="page">Timeline</a>
      </nav>

      <header class="header baby-header">
        <p id="syncStatus" class="sync-status" hidden></p>
      </header>

      <div class="timeline-nav" aria-label="Day navigation">
        <button type="button" class="timeline-nav-btn" id="timelinePrev" aria-label="Previous day">‹</button>
        <button type="button" class="timeline-today-btn" id="timelineToday">Today</button>
        <span class="timeline-date-label" id="timelineDateLabel" aria-live="polite"></span>
        <button type="button" class="timeline-nav-btn" id="timelineNext" aria-label="Next day">›</button>
      </div>

      <div class="timeline-scroll" id="timelineScroll" aria-label="Day timeline">
        <div class="timeline-inner" id="timelineInner">
          <!-- Populated by timeline_page.js -->
        </div>
      </div>
    </div>

    <dialog class="options-dialog login-dialog" id="loginDialog" aria-labelledby="loginTitle" aria-modal="true">
      <form class="options-form" id="loginForm">
        <h2 id="loginTitle" class="options-title">Sign in</h2>
        <p class="options-intro">
          Same email and password as in Supabase (Authentication → Users). This makes your logs show up on other devices.
        </p>
        <div class="options-field">
          <label class="options-label" for="loginEmail">Email</label>
          <div class="options-number-wrap login-field-wrap">
            <input
              id="loginEmail"
              name="email"
              class="options-input"
              type="email"
              autocomplete="username"
              required
            />
          </div>
        </div>
        <div class="options-field">
          <label class="options-label" for="loginPassword">Password</label>
          <div class="options-number-wrap login-field-wrap">
            <input
              id="loginPassword"
              name="password"
              class="options-input"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>
        <p id="loginError" class="options-hint login-error" hidden></p>
        <div class="options-actions login-actions">
          <button type="submit" class="btn-primary login-submit" id="loginSubmit">Sign in</button>
        </div>
      </form>
    </dialog>

    <script src="supabase-config.js"></script>
    <script type="module" src="timeline_page.js"></script>
  </body>
</html>
